spring.application.name=plataforma-domicilios
server.port=8080

# --- Base de datos en memoria (H2) para la demo --------------------------------
spring.datasource.url=jdbc:h2:mem:domicilios;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- Logs: solo advertencias para que la demo por consola se lea limpia ----------
logging.level.root=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# --- Configuración de la plataforma -----------------------------------------------
# true = ejecuta la demo por consola al iniciar
domicilios.demo.consola=true
# Estrategia de asignación: mas-cercano | menos-ocupado
domicilios.asignacion.estrategia=mas-cercano
# Estrategia del tiempo estimado: velocidad-promedio | con-trafico
domicilios.tiempo.estrategia=velocidad-promedio
# Costo del domicilio = tarifa base + tarifa por km
domicilios.envio.tarifa-base=3000
domicilios.envio.tarifa-por-km=1200
